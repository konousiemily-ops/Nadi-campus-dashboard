<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadi Campus & Weather Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            /* Warm tropical dusk palette (emerald green, warm coral glow, deep twilight navy) */
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow orbs */
        .ambient-orb-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            top: 10%;
            left: 15%;
            filter: blur(40px);
            z-index: 0;
        }

        .ambient-orb-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 10%;
            right: 15%;
            filter: blur(40px);
            z-index: 0;
        }

        /* Glassmorphism Main Dashboard Container */
        .dashboard-card {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        /* Section Cards */
        .section-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        /* Weather Section */
        .weather-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-status {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }

        .weather-location {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }

        .weather-temp {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Calculator Section */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            font-weight: 700;
            color: #f59e0b;
            font-size: 15px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px 12px 32px;
            background: rgba(30, 41, 59, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Output Result Box */
        .result-box {
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .result-success {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .result-error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <!-- Ambient background elements -->
    <div class="ambient-orb-1"></div>
    <div class="ambient-orb-2"></div>

    <div class="dashboard-card">
        <div class="header">
            <span class="badge">Nadi Campus</span>
            <h1>Daily Dashboard</h1>
        </div>

        <!-- Weather Box -->
        <div class="section-box">
            <div class="section-title">Today's Forecast</div>
            <div class="weather-content">
                <div>
                    <div class="weather-status">Mostly Sunny</div>
                    <div class="weather-location">Nadi, Fiji</div>
                </div>
                <div class="weather-temp">30°C</div>
            </div>
        </div>

        <!-- Calculator Box -->
        <div class="section-box">
            <div class="section-title">Bus Fare Calculator</div>
            <div class="input-wrapper">
                <label for="budgetInput">Enter your budget (FJD)</label>
                <div class="input-group">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="budgetInput" placeholder="0.00" step="0.01" min="0">
                </div>
                <button onclick="calculateRides()">Calculate Rides</button>
            </div>
            <div id="rideResult" class="result-box"></div>
        </div>
    </div>

    <script>
        function calculateRides() {
            const farePerRide = 1.50;
            const budgetInput = document.getElementById('budgetInput').value;
            const resultDiv = document.getElementById('rideResult');

            const budget = parseFloat(budgetInput);

            if (isNaN(budget) || budget <= 0) {
                resultDiv.className = "result-box result-error";
                resultDiv.innerHTML = "Please enter a valid budget amount.";
                resultDiv.style.display = "block";
                return;
            }

            const totalRides = Math.floor(budget / farePerRide);
            const remainder = (budget % farePerRide).toFixed(2);

            resultDiv.className = "result-box result-success";
            resultDiv.innerHTML = `You can take <strong>${totalRides}</strong> ride(s) with <strong>$${remainder} FJD</strong> remaining.`;
            resultDiv.style.display = "block";
        }
    </script>
</body>
</html>
